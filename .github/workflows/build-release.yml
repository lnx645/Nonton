name: Build release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Decode release keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          echo "${{ secrets.NONTON_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore/release.keystore"
      - name: Build release APK (signed)
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          NONTON_RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          NONTON_RELEASE_STORE_PASSWORD: ${{ secrets.NONTON_RELEASE_STORE_PASSWORD }}
          NONTON_RELEASE_KEY_ALIAS: ${{ secrets.NONTON_RELEASE_KEY_ALIAS }}
          NONTON_RELEASE_KEY_PASSWORD: ${{ secrets.NONTON_RELEASE_KEY_PASSWORD }}
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          generate_release_notes: true
